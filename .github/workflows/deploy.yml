# Release deploy.
#
# HOW A CHANGE REACHES THE STOREFRONT
#
# The live theme is CONNECTED to the live branch through Shopify's GitHub
# integration. Shopify watches that branch and applies commits itself. Nothing
# here runs `shopify theme push` against the live theme: the deploy is a git
# push, and Shopify does the publishing.
#
# The integration runs no build step. Shopify's documentation is explicit that
# it supports "a buildless theme, or a theme that has already gone through any
# necessary file transformations". Since this theme is built with Vite and the
# build output is gitignored, the live branch has to carry source AND compiled
# assets. That is the entire reason a separate built branch exists.
#
#   main         source of truth, build output gitignored
#   main-live    connected to the live theme, carries source + build output.
#                Shopify writes merchandiser changes back here.
#   main-built   transient. main-live + main + a fresh build, merged to main-live.
#
name: Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy is being run manually
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  BASE_BRANCH: main
  LIVE_BRANCH: main-live
  BUILT_BRANCH: main-built
  DATA_BRANCH: main-live-data

jobs:
  # ── Gate ────────────────────────────────────────────────────────────────────
  #
  # Refuse to deploy while merchandiser content sits unmerged.
  #
  # Shopify commits theme-editor changes to the live branch, and a separate
  # workflow raises those as a pull request back into the development branches.
  # If that pull request has not been merged, the live branch holds content the
  # repository does not have. Deploying anyway merges over it.
  #
  # The inherited pipeline merged with `-X theirs`, meaning the repository won
  # every conflict silently. Weeks of merchandiser work could disappear with no
  # error and no log line. This job is the structural fix: the deploy does not
  # start until the content is reconciled.
  check-writeback:
    name: Check for unmerged live content
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    steps:
      - name: Block on open write-back pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --label live-data --state open \
            --json number,title,createdAt \
            --jq '.[] | "  #\(.number)  \(.createdAt[0:10])  \(.title)"')

          if [ -n "$OPEN" ]; then
            {
              echo "### Deploy blocked: unmerged live content"
              echo ""
              echo "These write-back pull requests carry merchandiser changes that are"
              echo "not yet in the repository. Deploying now would overwrite them."
              echo ""
              echo '```'
              echo "$OPEN"
              echo '```'
              echo ""
              echo "Merge them, then re-run this deploy."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Open write-back pull request(s). Merge before deploying."
            echo "$OPEN"
            exit 1
          fi
          echo "No open write-back pull requests."

      # A pull request is not the only way content can be sitting unmerged.
      # Compare the branches directly so a deleted, closed, or never-created
      # pull request cannot hide real divergence.
      - name: Compare live branch against base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if ! gh api "repos/$GITHUB_REPOSITORY/branches/$LIVE_BRANCH" --silent 2>/dev/null; then
            echo "::notice::$LIVE_BRANCH does not exist yet. Nothing to compare."
            exit 0
          fi

          # Any file that differs counts as drift, except build output.
          #
          # Shopify commits whatever changes on a connected theme: settings JSON
          # from the theme editor, Liquid from the code editor, and files written
          # by installed apps. An allow-list of "content" paths would let every
          # other file through, and this gate exists precisely to stop the deploy
          # overwriting things nobody knew were changed.
          #
          # The exclusions below are the compiled Vite output, which lives on the
          # live branch by design and is expected to differ on every release.
          CHANGED=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_BRANCH...$LIVE_BRANCH" \
            --jq '[.files[]?.filename
                   | select(test("^assets/.*\\.(asset|bundle|chunk)\\.") | not)
                   | select(. != "assets/manifest.json" and . != "assets/runtime.js")
                   | select(test("^snippets/(vite-tag|script-tags|style-tags)\\.liquid$") | not)
                  ] | join("\n")')

          if [ -n "$CHANGED" ]; then
            {
              echo "### Deploy blocked: live content not in the repository"
              echo ""
              echo "These content files differ on \`$LIVE_BRANCH\`:"
              echo ""
              echo '```'
              echo "$CHANGED"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Live content not reconciled. See the run summary."
            exit 1
          fi
          echo "Live branch content matches the repository."

  # ── Deploy ──────────────────────────────────────────────────────────────────
  deploy:
    name: Build and release
    needs: check-writeback
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: package.json
          cache: npm

      # Start from the live branch so merchandiser content is the base, then
      # bring in the code. The check-writeback job has already established that
      # there is no unreconciled content, so this merge should be clean.
      #
      # DEFECT FIXED (inherited pipeline: deploy-release.yml)
      # The original used `git merge $BASE_BRANCH -X theirs`, which resolves every
      # conflict in favour of the repository without reporting it. Halt instead,
      # and say which files are in conflict.
      - name: Assemble the built branch
        run: |
          set -euo pipefail
          git fetch origin "$LIVE_BRANCH" "$BASE_BRANCH"

          git checkout -B "$BUILT_BRANCH" "origin/$LIVE_BRANCH"

          if ! git merge "origin/$BASE_BRANCH" --no-edit; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            {
              echo "### Deploy halted: merge conflict"
              echo ""
              echo "Conflicts between the live branch and the repository:"
              echo ""
              echo '```'
              echo "$CONFLICTS"
              echo '```'
              echo ""
              echo "Resolve these deliberately. The previous pipeline resolved them"
              echo "automatically in favour of the repository, which silently discarded"
              echo "merchandiser content."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Merge conflict. See the run summary."
            git merge --abort
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Assert the build actually produced what the theme needs, rather than
      # trusting a zero exit code.
      #
      # The theme renders assets through a generated snippet. In development that
      # snippet points at a local Vite dev server. If a stale or missing snippet
      # reached the live branch, every component depending on it would silently
      # fail to load, and Theme Check would not catch it because the file is
      # gitignored and excluded from linting.
      - name: Verify build output
        run: |
          set -euo pipefail
          MISSING=0

          for f in snippets/vite-tag.liquid assets/manifest.json; do
            if [ ! -f "$f" ]; then
              echo "::error::Build did not produce $f"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 1 ] && exit 1

          # A production build must not reference a local dev server.
          if grep -qE 'localhost:[0-9]+|127\.0\.0\.1' snippets/vite-tag.liquid; then
            echo "::error::vite-tag.liquid references a local dev server. This is a development build."
            grep -nE 'localhost:[0-9]+|127\.0\.0\.1' snippets/vite-tag.liquid | head -5
            exit 1
          fi

          echo "Build output verified."

      # The live branch must carry compiled assets, which are gitignored in the
      # repository. Force-add exactly the build output rather than replacing
      # .gitignore wholesale.
      #
      # DEFECT FIXED (inherited pipeline: deploy-release.yml)
      # The original overwrote .gitignore with "node_modules/" and ran `git add -A`,
      # which sweeps in anything else present in the working tree, including files
      # that were gitignored for good reason.
      - name: Commit build output
        run: |
          set -euo pipefail
          git add --force \
            assets/manifest.json \
            assets/*.asset.* assets/*.bundle.* assets/*.chunk.* \
            assets/runtime.js \
            snippets/vite-tag.liquid \
            snippets/script-tags.liquid \
            snippets/style-tags.liquid \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "::warning::Build produced no changes to commit."
          else
            git commit -m "Build output for ${GITHUB_SHA:0:7}"
          fi

      # The push Shopify is watching. This is the deploy.
      - name: Release to the live branch
        id: release
        run: |
          set -euo pipefail
          git checkout "$BUILT_BRANCH"
          git push origin "HEAD:$LIVE_BRANCH"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Pushed to $LIVE_BRANCH. Shopify will apply it to the live theme."

      - name: Notify Slack
        if: always()
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
          store-url: ${{ vars.SHOPIFY_STORE && format('https://{0}', vars.SHOPIFY_STORE) || '' }}
          reason: ${{ inputs.reason }}
