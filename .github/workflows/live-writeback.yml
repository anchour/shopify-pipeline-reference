# Brings merchandiser changes back into the repository.
#
# Shopify commits to the connected branch whenever the theme is changed in the
# admin, and per Shopify's documentation this "can't be disabled". Those commits
# are real content: theme editor settings, section arrangement, template JSON.
#
# Without a return path that content exists only on the live branch, and the next
# release merges over it. This workflow raises it as a pull request so a human
# sees what Shopify wrote before it enters the development branches.
#
# The deploy workflow refuses to run while one of these pull requests is open.
name: Live writeback

on:
  push:
    branches: [main-live]
  # Manual retry. Without this, a failed writeback can only be re-attempted by
  # asking someone to go and edit the theme again, because the push trigger only
  # fires on Shopify's own commits. A workflow that recovers from its own
  # failures only by human action in a third-party admin is not operable.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: live-writeback

env:
  LIVE_BRANCH: main-live
  DATA_BRANCH: main-live-data
  # The branch merchandiser content returns to. This is the branch the deploy
  # builds from, so it must be the one the gate compares against: main here.
  # Where a develop branch is the integration point, set it to develop and make
  # sure the deploy gate compares against the same branch, or the gate will
  # block on content the writeback has already delivered elsewhere.
  TARGET_BRANCH: main

jobs:
  writeback:
    name: Raise write-back pull request
    # Only Shopify's own commits, so a release push does not loop back into a
    # pull request. Manual dispatch bypasses the check: it is a deliberate
    # retry, and there is no pusher to inspect.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pusher.name == 'shopify[bot]' ||
      github.event.sender.login == 'shopify[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Carry back EVERYTHING Shopify changed, minus build output.
      #
      # Shopify commits any file that changes on a connected theme, not just
      # settings JSON. The theme editor writes settings and section groups, the
      # code editor writes Liquid, and installed apps write their own files.
      # Shopify's documentation is explicit that "files are updated in GitHub
      # whenever changes are made to a connected theme".
      #
      # An allow-list is therefore the wrong shape and is silently lossy: any
      # file type not on the list gets stranded on the live branch and is
      # overwritten by the next release, which is precisely the data loss this
      # pipeline exists to prevent. Deny-list instead, and keep the deny-list to
      # the one category that genuinely must not travel back.
      - name: Collect changes from the live branch
        id: collect
        run: |
          set -euo pipefail
          git fetch origin "$LIVE_BRANCH" "$TARGET_BRANCH"
          git checkout -B "$DATA_BRANCH" "origin/$TARGET_BRANCH"

          # Take the live branch state wholesale.
          git checkout "origin/$LIVE_BRANCH" -- . 2>/dev/null || true

          # Two exclusions.
          #
          # Compiled build output is generated by Vite, gitignored in source, and
          # exists on the live branch by design. Letting it back into the source
          # branches would commit build artifacts to a repository that
          # deliberately does not track them.
          #
          # .github/ is CI configuration. Shopify never writes to it, so any
          # difference is the live branch being BEHIND the repository, not new
          # content. Carrying it back would propose reverting workflow changes
          # that were merged after the live branch last caught up.
          #
          # Everything else comes back, including Liquid edited in the code
          # editor. Such an edit should not have happened, and bringing it back
          # is how it becomes visible and reviewable rather than silently lost at
          # the next deploy.
          EXCLUDE=(
            'assets/*.asset.*' 'assets/*.bundle.*' 'assets/*.chunk.*'
            'assets/manifest.json' 'assets/runtime.js'
            'snippets/vite-tag.liquid' 'snippets/script-tags.liquid'
            'snippets/style-tags.liquid'
            '.github/*'
          )
          git reset -q -- "${EXCLUDE[@]}" 2>/dev/null || true
          git checkout -- "${EXCLUDE[@]}" 2>/dev/null || true

          if git diff --cached --quiet && git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to bring back."
            exit 0
          fi

          git add -A
          git commit -m "Changes from ${LIVE_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Flag Liquid or other code that came back. Content is expected; code
          # means someone used the admin code editor on a connected theme, which
          # is worth a reviewer's attention.
          CODE=$(git diff --name-only "origin/$TARGET_BRANCH"..HEAD \
            | grep -E '\.(liquid|js|css|scss)$' || true)
          {
            echo 'code<<EOF'
            echo "$CODE"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          FILES=$(git diff --name-only "origin/$TARGET_BRANCH"..HEAD | head -20)
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # force-with-lease, not force. If someone else has pushed to the data
      # branch since we read it, the push is refused rather than discarding their
      # work.
      #
      # DEFECT FIXED (inherited pipeline: live-data-pr.yml)
      # The original ended its push chain with `|| echo "Nothing to commit"`,
      # which caught every failure and exited zero. A rejected push looked exactly
      # like a clean no-op, so a broken write-back could go unnoticed indefinitely.
      - name: Push data branch
        if: steps.collect.outputs.changed == 'true'
        run: git push --force-with-lease origin "$DATA_BRANCH"

      - name: Open or update the pull request
        if: steps.collect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES: ${{ steps.collect.outputs.files }}
          CODE: ${{ steps.collect.outputs.code }}
        run: |
          set -euo pipefail

          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$DATA_BRANCH" --state open --json number --jq '.[0].number // ""')

          # Built with printf rather than a heredoc. A heredoc terminator has to
          # sit at column zero, which breaks out of the YAML block scalar this
          # script lives inside.
          BODY="Shopify committed these changes to \`$LIVE_BRANCH\` after someone"
          BODY="$BODY edited the theme in the Shopify admin."
          BODY="$BODY"$'\n\n'"Merge this so the changes are in the repository."
          BODY="$BODY **The deploy workflow will refuse to run while this pull"
          BODY="$BODY request is open**, because releasing without it would"
          BODY="$BODY overwrite them."

          if [ -n "${CODE//[[:space:]]/}" ]; then
            BODY="$BODY"$'\n\n'"> [!WARNING]"
            BODY="$BODY"$'\n'"> **Code files changed, not just content.** Someone edited theme"
            BODY="$BODY"$'\n'"> code in the Shopify admin rather than through a pull request."
            BODY="$BODY"$'\n'"> Shopify overwrote the repository version with no conflict warning,"
            BODY="$BODY"$'\n'"> so these edits bypassed review entirely:"
            BODY="$BODY"$'\n'">"
            BODY="$BODY"$'\n'"$(echo "$CODE" | sed 's/^/> - `/; s/$/`/')"
          fi

          BODY="$BODY"$'\n\n'"Changed files:"$'\n\n''```'$'\n'"$FILES"$'\n''```'

          # Create the label if it is missing rather than letting pr create fail.
          #
          # gh pr create --label fails outright when the label does not exist, and
          # it fails AFTER opening nothing, so the run reports failure with no PR.
          # The deploy gate finds write-back PRs by this label, so the whole
          # mechanism depends on a label that nothing was responsible for
          # creating. Make the workflow self-sufficient in a fresh repository.
          gh label create live-data --repo "$GITHUB_REPOSITORY" \
            --description "Merchandiser content written back from the live theme by Shopify" \
            --color 0E8A16 2>/dev/null || true

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "::notice::Updated existing write-back pull request #$EXISTING."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base "$TARGET_BRANCH" --head "$DATA_BRANCH" \
              --title "Merchandiser content from $LIVE_BRANCH" \
              --body "$BODY" --label live-data
          fi
