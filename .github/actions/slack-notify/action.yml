name: Slack deploy notification
description: Posts a deploy result to Slack via an incoming webhook.

inputs:
  webhook:
    description: Slack incoming webhook URL
    required: true
  status:
    description: Job status (success, failure, cancelled)
    required: true
  store-url:
    description: Storefront URL, when the deploy succeeded
    required: false
    default: ""
  rollback-name:
    description: Name of the rollback theme captured before deploying
    required: false
    default: ""
  drifted:
    description: Whether live content drift was detected
    required: false
    default: "false"
  reason:
    description: Reason given for a manual deploy
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Post to Slack
      shell: bash
      env:
        # Every value is passed through the environment rather than interpolated
        # into the script body. GitHub expands ${{ }} before bash ever parses the
        # line, so a branch or PR title containing quotes or a backtick would
        # otherwise break the script or execute as code. The inherited pipeline
        # interpolated directly into run blocks in several places.
        WEBHOOK: ${{ inputs.webhook }}
        STATUS: ${{ inputs.status }}
        STORE_URL: ${{ inputs.store-url }}
        ROLLBACK_NAME: ${{ inputs.rollback-name }}
        DRIFTED: ${{ inputs.drifted }}
        REASON: ${{ inputs.reason }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ACTOR: ${{ github.actor }}
        SHA: ${{ github.sha }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -uo pipefail

        if [ -z "${WEBHOOK}" ]; then
          echo "::warning::SLACK_WEBHOOK_URL is not set. Skipping notification."
          exit 0
        fi

        case "$STATUS" in
          success)   EMOJI="🚀"; HEADING="Deploy succeeded"; COLOR="#2eb886" ;;
          failure)   EMOJI="🔴"; HEADING="Deploy FAILED";    COLOR="#d63a2f" ;;
          cancelled) EMOJI="⚪"; HEADING="Deploy cancelled"; COLOR="#9aa0a6" ;;
          *)         EMOJI="❓"; HEADING="Deploy finished: $STATUS"; COLOR="#9aa0a6" ;;
        esac

        CONTEXT="Triggered by ${ACTOR} · \`${SHA:0:7}\`"
        if [ -n "${PR_NUMBER}" ] && [ "${PR_NUMBER}" != "null" ]; then
          CONTEXT="${CONTEXT} · PR #${PR_NUMBER}"
        fi
        if [ -n "${REASON}" ]; then
          CONTEXT="${CONTEXT} · Manual: ${REASON}"
        fi

        # jq --arg handles all escaping, so a quote or newline in any value
        # cannot produce malformed JSON.
        BLOCKS=$(jq -n \
          --arg heading "$EMOJI  $HEADING" \
          --arg context "$CONTEXT" \
          --arg run_url "$RUN_URL" \
          --arg repo "$REPO" \
          '[
            { type: "header", text: { type: "plain_text", text: $heading, emoji: true } },
            { type: "context", elements: [ { type: "mrkdwn", text: $context } ] },
            { type: "section", fields: [ { type: "mrkdwn", text: ("*Repository*\n" + $repo) } ] }
          ]')

        if [ "$STATUS" = "success" ] && [ -n "${STORE_URL}" ]; then
          BLOCKS=$(echo "$BLOCKS" | jq --arg url "$STORE_URL" \
            '. + [ { type: "section", text: { type: "mrkdwn", text: ("*Live site*\n<" + $url + "|" + $url + ">") } } ]')
        fi

        if [ -n "${ROLLBACK_NAME}" ]; then
          BLOCKS=$(echo "$BLOCKS" | jq --arg r "$ROLLBACK_NAME" \
            '. + [ { type: "section", text: { type: "mrkdwn", text: ("*Rollback available*\nPublish theme `" + $r + "` to revert.") } } ]')
        fi

        if [ "$DRIFTED" = "true" ]; then
          BLOCKS=$(echo "$BLOCKS" | jq \
            '. + [ { type: "section", text: { type: "mrkdwn", text: ":warning: *Live content drift detected.* Someone changed content in the Shopify admin that is not in the repository. See the run summary." } } ]')
        fi

        BLOCKS=$(echo "$BLOCKS" | jq --arg url "$RUN_URL" \
          '. + [ { type: "actions", elements: [ { type: "button", text: { type: "plain_text", text: "View run" }, url: $url } ] } ]')

        PAYLOAD=$(jq -n --arg color "$COLOR" --argjson blocks "$BLOCKS" \
          '{ attachments: [ { color: $color, blocks: $blocks } ] }')

        # Fail the step if Slack rejects the payload. A notification step that
        # swallows its own errors is how you discover months later that nobody
        # has been getting alerts.
        HTTP=$(curl -sS -o /tmp/slack-response.txt -w '%{http_code}' \
          -X POST -H 'Content-type: application/json' \
          --data "$PAYLOAD" "$WEBHOOK")

        if [ "$HTTP" != "200" ]; then
          echo "::error::Slack returned HTTP $HTTP: $(cat /tmp/slack-response.txt)"
          exit 1
        fi
        echo "Slack notification delivered."
